name: Collect market data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: market-pulse-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Inspect project files
        run: |
          pwd
          ls -la
          ls -la docs || true
          python -c "import pathlib; print('collect.py exists:', pathlib.Path('collect.py').is_file())"

      - name: Collect market data
        run: python -u collect.py

      - name: Show collected numeric values
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/market_data.json')
          if not p.exists():
              print('No JSON output yet: docs/market_data.json')
          else:
              data=json.loads(p.read_text(encoding='utf-8'))
              print('as_of:', data.get('as_of'))
              print('VALUES:', data.get('values', {}))
              print('ERRORS:', data.get('errors', {}))
          PY

      - name: Commit collected data
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/market_data.json
          if git diff --cached --quiet; then
            echo 'Data unchanged'
          else
            git commit -m 'Update market data [skip ci]'
            git push origin HEAD:main
          fi
