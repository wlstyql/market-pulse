name: Collect market data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: market-pulse-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check required files
        run: |
          ls -la
          test -f collect.py
          test -f market_pulse_core.py
          test -f market_sources.py
          test -f docs/index.html
          mkdir -p docs
      - name: Collect market data
        run: python collect.py
      - name: Show data collection diagnostics
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/market_data.json')
          if not p.exists():
              print('ERROR: docs/market_data.json was not generated')
              raise SystemExit(1)
          data = json.loads(p.read_text(encoding='utf-8'))
          print('Collected at:', data.get('as_of'))
          values = data.get('values', {})
          print('NUMERIC VALUES:', len(values))
          for key, value in sorted(values.items()):
              print('  ', key, '=', value)
          print('COLLECTION ERRORS:')
          for key, error in sorted(data.get('errors', {}).items()):
              print('  ', key, ':', str(error)[:240])
          if not values:
              print('WARNING: all data sources failed or no new data was collected')
          PY
      - name: Commit published market data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/market_data.json
          if git diff --cached --quiet; then
            echo 'No market data changes to publish'
          else
            git commit -m 'Update market data [skip ci]'
            git push origin HEAD:main
          fi
