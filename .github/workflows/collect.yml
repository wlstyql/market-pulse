
name: Collect market data

on:
  push:
    branches: [main]
    paths: ['docs/index.html', 'market_pulse_core.py', 'official_indicators.py', 'market_sources.py', 'collect.py']
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-pulse-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Inspect project files
        run: |
          pwd
          ls -la
          ls -la docs

      - name: Collect and write JSON
        env:
          KR_BUFFETT_MANUAL_VALUE: ${{ vars.KR_BUFFETT_MANUAL_VALUE }}
          KR_BUFFETT_MANUAL_AS_OF: ${{ vars.KR_BUFFETT_MANUAL_AS_OF }}
        run: python collect.py

      - name: Validate website files
        run: |
          test -s docs/index.html
          test -s docs/market_data.json
          python -m json.tool docs/market_data.json > /dev/null
          echo "Website files verified"

      - name: Show collected numeric values
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(
              Path("docs/market_data.json").read_text(encoding="utf-8")
          )
          print("VALUES:", data.get("values", {}))
          print("ERRORS:", data.get("errors", {}))
          PY

      - name: Commit collected data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/market_data.json
          if git diff --cached --quiet; then
            echo "Data unchanged"
          else
            git commit -m "Update market data [skip ci]"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
